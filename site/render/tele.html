<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@87.5,300..500&display=swap">
<style>
html,body{margin:0;background:#000}
.t{width:1200px;height:700px;box-sizing:border-box;padding:44px 52px;font:400 40px/1.42 "Martian Mono",monospace;font-variation-settings:"wdth" 87.5;color:#2fe383;
 text-shadow:0 0 6px rgba(47,227,131,.55),0 0 18px rgba(47,227,131,.25);display:flex;flex-direction:column;gap:0}
.hd{margin-bottom:auto!important}
.hd{display:flex;justify-content:space-between;font-size:26px;letter-spacing:.06em;opacity:.75;padding-bottom:14px;margin-bottom:22px;border-bottom:2px dashed rgba(47,227,131,.4)}
.row{display:grid;grid-template-columns:200px 1fr;column-gap:18px}
.k{opacity:.55}
.th{opacity:.5}
.old{opacity:.38}
.cur::after{content:"";display:inline-block;width:.62em;height:1.05em;background:#2fe383;vertical-align:-.18em;margin-left:.15em;box-shadow:0 0 10px rgba(47,227,131,.8)}
</style>
<div class="t">
 <div class="hd"><span>RETHINK · ON A CALL</span><span>00:47</span></div>
 <div class="row old"><span class="k">caller</span><span>Is Dr. Iyer free on Friday?</span></div>
 <div class="row th"><span class="k">think</span><span>4:30 open. offer it.</span></div>
 <div class="row"><span class="k">rethink</span><span>She has 4:30 on Friday. Shall I book it?</span></div>
 <div class="row"><span class="k">caller</span><span>Yes, please.</span></div>
 <div class="row th"><span class="k">think</span><span class="cur">book 4:30 · send SMS confirm</span></div>
</div>
